name: pentapol
description: "Pentamino en groupe"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

#
version: 1.0.7+7

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  intl: ^0.20.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.0
  path: ^1.9.0
  yaml: ^3.1.3
  web_socket_channel: ^2.4.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/solutions_6x10_normalisees.bin
    - assets/data/subset_counts.bin
    - assets/data/solutions_corpus.bin
    - assets/images/puzzle_landscape_01.png
    - assets/images/pentapol_puzzle_landscape_3x5.png
